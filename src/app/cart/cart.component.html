<div class="container">
    <h2>Kosár</h2>
    <div *ngFor="let t of kosar" class="row">
        <div class="col">{{t.nev}}</div>
        <div class="col">{{t.db}} {{t.mennyiseg}} = {{price(t)}} Ft</div>
    </div>

    <button (click)="leadas()" class="btn btn-dark" type="button">Rendelés leadása</button>
</div>
