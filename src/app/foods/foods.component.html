<!-- {{foods|json}} -->
<style>
    .gap {
        gap: 20px;
    }
</style>

<div class="row mb-3 mt-3">
    <div class="col">
        <div class="input-group ">
            <span class="inpt-grop-text me-2" id="basic-addon1">Keresés</span>
            <input (keyup)="onKeyUp($event)" [(ngModel)]="keresoSzo" type="text" class="form-control" placeholder="Keresés...">
        </div>
    </div>
    <div class="col">
        <button (click)="RendezesIranyValt()" class="btn btn-outline-success">{{rendezesTomb[rendezesAllapot]}}</button>
    </div>
</div>

<div  class="row gap mt-3">
<!-- <div *ngFor="let food of (foods|search:keresoSzo)|sort:rendezesAllapot" class="row gap mt-3"> -->
    <div *ngFor="let food of foods|search:keresoSzo|sort:rendezesAllapot" class="card" style="width: 18rem;">
        <img class="card-img-top" [src]="food.kep" alt="Ételkép">
        <div class="card-body">
          <h5 class="card-title">{{food.nev}}</h5>
          <p class="card-text">{{food.leiras}}</p>
          
          <p class="card-text">{{food.ar}}/{{food.mennyiseg}}
            <input #db value="1" type="number" class="form-control form mt-2">
            <button (click)="addTetel(food, db.value)" class="btn btn-outline-success mt-2"><i  class="bi bi-basket"></i> Kosárba</button>
          </p>
        </div>
      </div>
</div>
